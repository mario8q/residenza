version: '3.9'

services:

  # ── PostgreSQL ────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: residenciaspro_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-residenza_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-residenza_pass}
      POSTGRES_DB: ${POSTGRES_DB:-residenciaspro}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Script de inicialización: crea extensiones necesarias
      - ./backend/src/config/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-residenza_user} -d ${POSTGRES_DB:-residenciaspro}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ───────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: residenciaspro_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-residenza_user}:${POSTGRES_PASSWORD:-residenza_pass}@db:5432/${POSTGRES_DB:-residenciaspro}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
    ports:
      - '3000:3000'
    volumes:
      # Hot-reload: monta el código fuente en el contenedor
      - ./backend/src:/app/src
    command: npm run dev

  # ── pgAdmin (opcional, herramienta visual de BD) ─────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: residenciaspro_pgadmin
    restart: unless-stopped
    profiles:
      - tools   # Solo se levanta con: docker-compose --profile tools up
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@residenciaspro.co}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - '5050:80'
    depends_on:
      - db

volumes:
  postgres_data:
    name: residenciaspro_postgres_data
