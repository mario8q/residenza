<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResidenciasPro – Iniciar sesión</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:      #0a0e1a;
      --surface: #111827;
      --border:  #1e2d47;
      --accent:  #3b82f6;
      --accent2: #10b981;
      --accent4: #ef4444;
      --text:    #e2e8f0;
      --text2:   #94a3b8;
      --text3:   #64748b;
      --gold:    #d4a853;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Fondo decorativo */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 60% 40%, rgba(59,130,246,0.06) 0%, transparent 60%),
                  radial-gradient(ellipse at 20% 80%, rgba(16,185,129,0.04) 0%, transparent 50%);
      pointer-events: none;
    }

    .login-wrapper {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }

    /* Logo / Brand */
    .brand {
      text-align: center;
      margin-bottom: 36px;
    }
    .brand-title {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.01em;
    }
    .brand-sub {
      font-size: 0.8rem;
      color: var(--text3);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 4px;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .card-sub {
      font-size: 0.83rem;
      color: var(--text3);
      margin-bottom: 28px;
    }

    /* Form */
    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block;
      font-size: 0.78rem;
      color: var(--text2);
      margin-bottom: 7px;
      font-weight: 500;
    }
    .form-input {
      width: 100%;
      background: #0d1526;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 14px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .form-input:focus { border-color: var(--accent); }
    .form-input.error { border-color: var(--accent4); }

    /* Submit */
    .btn-submit {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-submit:hover:not(:disabled) { background: #2563eb; }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Error banner */
    .error-banner {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 0.83rem;
      color: var(--accent4);
      margin-bottom: 20px;
      display: none;
    }
    .error-banner.visible { display: block; }

    /* Success banner */
    .success-banner {
      background: rgba(16,185,129,0.1);
      border: 1px solid rgba(16,185,129,0.3);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 0.83rem;
      color: var(--accent2);
      margin-bottom: 20px;
      display: none;
    }
    .success-banner.visible { display: block; }

    /* Spinner */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    .spinner.visible { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Footer hint */
    .hint {
      text-align: center;
      margin-top: 20px;
      font-size: 0.77rem;
      color: var(--text3);
    }
    .hint a { color: var(--accent); text-decoration: none; }
    .hint a:hover { text-decoration: underline; }

    /* API status */
    .api-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      color: var(--text3);
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    .api-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text3);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .api-dot.ok      { background: var(--accent2); }
    .api-dot.error   { background: var(--accent4); }
    .api-dot.loading { background: var(--accent3); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* Token preview (dev mode) */
    .token-preview {
      margin-top: 20px;
      background: #0a1020;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      display: none;
    }
    .token-preview.visible { display: block; }
    .token-label {
      font-size: 0.7rem;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }
    .token-val {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--accent2);
      word-break: break-all;
      line-height: 1.5;
    }
    .user-info {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
    }
    .user-info div { margin-bottom: 4px; color: var(--text2); }
    .user-info span { color: var(--text); font-weight: 500; }
  </style>
</head>
<body>

<div class="login-wrapper">
  <!-- Brand -->
  <div class="brand">
    <div class="brand-title">ResidenciasPro</div>
    <div class="brand-sub">Panel de Administración</div>
  </div>

  <!-- Card -->
  <div class="card">
    <div class="card-title">Iniciar sesión</div>
    <div class="card-sub">Ingresa con tus credenciales de administrador</div>

    <!-- Error / Success -->
    <div class="error-banner" id="error-banner"></div>
    <div class="success-banner" id="success-banner"></div>

    <!-- Formulario -->
    <div class="form-group">
      <label class="form-label" for="email">Correo electrónico</label>
      <input
        class="form-input"
        type="email"
        id="email"
        placeholder="admin@bellohorizonte.co"
        autocomplete="email"
        value="admin@bellohorizonte.co"
      >
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Contraseña</label>
      <input
        class="form-input"
        type="password"
        id="password"
        placeholder="••••••••"
        autocomplete="current-password"
        value="Admin2025!"
      >
    </div>

    <button class="btn-submit" id="btn-login">
      <span id="btn-text">Iniciar sesión</span>
      <div class="spinner" id="spinner"></div>
    </button>

    <!-- Estado de la API -->
    <div class="api-status">
      <div class="api-dot loading" id="api-dot"></div>
      <span id="api-status-text">Verificando conexión con la API...</span>
    </div>

    <!-- Token preview (solo en desarrollo) -->
    <div class="token-preview" id="token-preview">
      <div class="token-label">✅ Login exitoso — Token JWT recibido</div>
      <div class="token-val" id="token-val"></div>
      <div class="user-info" id="user-info"></div>
    </div>
  </div>

  <div class="hint">
    ¿Olvidaste tu contraseña? <a href="#">Recuperar acceso</a>
  </div>
</div>

<script>
  // ── Configuración ──────────────────────────────────────
  const API_URL = 'http://localhost:3000';

  // ── Referencias DOM ────────────────────────────────────
  const emailEl        = document.getElementById('email');
  const passwordEl     = document.getElementById('password');
  const btnLogin       = document.getElementById('btn-login');
  const btnText        = document.getElementById('btn-text');
  const spinner        = document.getElementById('spinner');
  const errorBanner    = document.getElementById('error-banner');
  const successBanner  = document.getElementById('success-banner');
  const apiDot         = document.getElementById('api-dot');
  const apiStatusText  = document.getElementById('api-status-text');
  const tokenPreview   = document.getElementById('token-preview');
  const tokenVal       = document.getElementById('token-val');
  const userInfo       = document.getElementById('user-info');

  // ── Verificar salud del backend al cargar ──────────────
  async function checkApiHealth() {
    try {
      const res = await fetch(`${API_URL}/health`, { signal: AbortSignal.timeout(4000) });
      if (res.ok) {
        const data = await res.json();
        apiDot.className = 'api-dot ok';
        apiStatusText.textContent = `API conectada — v${data.version} · ${new Date(data.timestamp).toLocaleTimeString('es-CO')}`;
      } else {
        throw new Error('Status ' + res.status);
      }
    } catch (err) {
      apiDot.className = 'api-dot error';
      apiStatusText.textContent = 'API no disponible — arranca el backend con npm run dev';
    }
  }

  // ── Helpers UI ─────────────────────────────────────────
  function showError(msg) {
    errorBanner.textContent = '⚠️ ' + msg;
    errorBanner.classList.add('visible');
    successBanner.classList.remove('visible');
  }

  function showSuccess(msg) {
    successBanner.textContent = '✅ ' + msg;
    successBanner.classList.add('visible');
    errorBanner.classList.remove('visible');
  }

  function clearMessages() {
    errorBanner.classList.remove('visible');
    successBanner.classList.remove('visible');
  }

  function setLoading(val) {
    btnLogin.disabled = val;
    btnText.textContent = val ? 'Verificando...' : 'Iniciar sesión';
    spinner.classList.toggle('visible', val);
  }

  // ── Login ──────────────────────────────────────────────
  async function handleLogin() {
    clearMessages();
    tokenPreview.classList.remove('visible');

    const email    = emailEl.value.trim();
    const password = passwordEl.value;

    // Validación básica client-side
    if (!email || !password) {
      showError('Ingresa tu correo y contraseña.');
      return;
    }

    setLoading(true);

    try {
      const res = await fetch(`${API_URL}/api/auth/login`, {
        method:      'POST',
        headers:     { 'Content-Type': 'application/json' },
        credentials: 'include',   // ← necesario para recibir la cookie de refresh token
        body: JSON.stringify({ email, password }),
      });

      const data = await res.json();

      if (!res.ok) {
        showError(data.error || 'Error al iniciar sesión.');
        return;
      }

      // ── Login exitoso ──────────────────────────────────
      showSuccess(`Bienvenido, ${data.user.nombre}`);

      // Guardar el access token en sessionStorage
      sessionStorage.setItem('accessToken', data.accessToken);
      sessionStorage.setItem('user', JSON.stringify(data.user));

      // Mostrar preview del token (modo desarrollo)
      tokenVal.textContent = data.accessToken;
      userInfo.innerHTML = `
        <div>Nombre: <span>${data.user.nombre}</span></div>
        <div>Email: <span>${data.user.email}</span></div>
        <div>Rol: <span>${data.user.rol}</span></div>
        <div>Conjunto: <span>${data.user.conjuntoNombre} (ID: ${data.user.conjuntoId})</span></div>
      `;
      tokenPreview.classList.add('visible');

      // Redirigir al dashboard después de 1.5s
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1500);

    } catch (err) {
      if (err.name === 'TypeError') {
        showError('No se pudo conectar al servidor. ¿El backend está corriendo?');
      } else {
        showError('Error inesperado: ' + err.message);
      }
    } finally {
      setLoading(false);
    }
  }

  // ── Eventos ────────────────────────────────────────────
  btnLogin.addEventListener('click', handleLogin);

  // Login con Enter
  [emailEl, passwordEl].forEach(el => {
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleLogin();
    });
  });

  // ── Init ───────────────────────────────────────────────
  checkApiHealth();

  // Si ya hay token válido, ir directo al dashboard
  const existingToken = sessionStorage.getItem('accessToken');
  if (existingToken) {
    window.location.href = 'index.html';
  }
</script>

</body>
</html>
